services:
  db:
    image: imresamu/postgis:17-3.6
    environment:
      POSTGRES_USER: tiles
      POSTGRES_PASSWORD: tiles
      POSTGRES_DB: tiles
    ports: ["5432:5432"]
    volumes:
      - tiles:/var/lib/postgresql/data
  osmium:
    image: iboates/osmium:1.19.0
    volumes:
      - ./data:/data
    working_dir: /data
volumes:
  tiles:

